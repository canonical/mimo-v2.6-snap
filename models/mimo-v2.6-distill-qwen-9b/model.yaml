name: mimo-v2.6-distill-qwen-9b

description: MiMo-V2.6-Distill-Qwen-9B, a 9B multimodal agentic model by Xiaomi MiMo (Q8_0 GGUF)
model-card-url: https://huggingface.co/ggml-org/MiMo-V2.6-Distill-Qwen-9B-GGUF
format: GGUF
quantization: Q8_0

disk-size: 9682M

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - model-9b-q8-0-gguf-1-of-2
  - model-9b-q8-0-gguf-2-of-2
  - mmproj-9b-q8-0-gguf

environment:
  # The model is split into multiple parts, maintained in individual component directories.
  # However, llama-server expects the parts to be located in the same directory.
  # The layout below flattens them into a single directory via symlinks.
  # The model file path is set to the first part's symlink:
  - MODEL_PARTS_DIR=/tmp/mimo-v2.6-distill-qwen-9b-q8-0-parts
  - MODEL_FILE=$MODEL_PARTS_DIR/MiMo-V2.6-Distill-Qwen-9B-Q8_0-00001-of-00002.gguf
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-9b-q8-0-gguf/mmproj-MiMo-V2.6-Distill-Qwen-9B-Q8_0.gguf

layout:
  $MODEL_PARTS_DIR/MiMo-V2.6-Distill-Qwen-9B-Q8_0-00001-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-9b-q8-0-gguf-1-of-2/MiMo-V2.6-Distill-Qwen-9B-Q8_0-00001-of-00002.gguf
  $MODEL_PARTS_DIR/MiMo-V2.6-Distill-Qwen-9B-Q8_0-00002-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-9b-q8-0-gguf-2-of-2/MiMo-V2.6-Distill-Qwen-9B-Q8_0-00002-of-00002.gguf
